name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check src/ tests/

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice --no-install-recommends
      - name: Install project
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        env:
          OPENAI_API_KEY: sk-fake-for-ci
        run: pytest -q

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    # Sin `continue-on-error`: el job estaba en rojo permanente y por eso se
    # dejó pasar. Ahora que está en cero, un error nuevo debe verse el día que
    # entra — si no, en dos semanas vuelve a haber 40 y nadie los mira.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run mypy
        run: mypy src/agropecuario
