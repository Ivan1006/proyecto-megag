[project]
name = "agropecuario-agent"
version = "0.1.0"
description = "Agente multi-etapa para generar proyectos agropecuarios desde correos Gmail"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Orquestación multi-agente
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    # Modelos de datos
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    # Gmail / Google Drive
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    # Parsers de adjuntos
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-docx>=1.1",
    "Pillow>=10.2",
    "pytesseract>=0.3.10",
    # Generación de entregables
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "xlsxwriter>=3.2",
    # RAG del Manual de Servicios (índice vectorial en memoria)
    "numpy>=1.26",
    # Utilidades
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "structlog>=24.1",
    # UI web (dashboard de trazabilidad)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
    # Stubs de las dependencias que sí los publican. Sin ellos mypy marca cada
    # módulo que las importa con [import-untyped] aunque no haya nada que
    # arreglar; con ellos, además, comprueba de verdad cómo las usamos (los de
    # openpyxl destaparon un `wb[sheet]` que podía ser None en el loader).
    "types-PyYAML>=6.0",
    "types-openpyxl>=3.1",
    "types-xlrd>=2.0",
]

[project.scripts]
agropecuario = "agropecuario.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agropecuario"]

[tool.mypy]
python_version = "3.11"
files = ["src/agropecuario"]

# Sin flags de modo estricto a propósito: mypy es aquí una red de seguridad
# sobre código ya escrito, no un corsé. Lo que se exige es que esté en VERDE,
# para que un error nuevo se note el día que aparece en vez de perderse entre
# decenas de preexistentes.

# Dependencias sin stubs publicados (ni `py.typed`). No es deuda nuestra: no hay
# nada que arreglar en nuestro código, así que se silencia el import y punto.
# `googleapiclient` y `google_auth_oauthlib` tienen stubs de terceros, pero son
# incompletos y meten más ruido del que quitan.
[[tool.mypy.overrides]]
module = [
    "pytesseract",
    "pdf2image",
    "googleapiclient.*",
    "google_auth_oauthlib.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.flake8-bugbear]
# Typer declara los parámetros del CLI llamando a typer.Option/Argument en el
# default del argumento: es su API, no el bug mutable que B008 persigue.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
