[project]
name = "agropecuario-agent"
version = "0.1.0"
description = "Agente multi-etapa para generar proyectos agropecuarios desde correos Gmail"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Orquestación multi-agente
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    # Modelos de datos
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    # Gmail / Google Drive
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    # Parsers de adjuntos
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-docx>=1.1",
    "Pillow>=10.2",
    "pytesseract>=0.3.10",
    # Generación de entregables
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "xlsxwriter>=3.2",
    # RAG del Manual de Servicios (índice vectorial en memoria)
    "numpy>=1.26",
    # Utilidades
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "structlog>=24.1",
    # UI web (dashboard de trazabilidad)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
]

[project.scripts]
agropecuario = "agropecuario.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agropecuario"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
