# Reglas de validación para el formulario Bancolombia/Finagro.
# Editar aquí (sin tocar código) para ajustar requisitos.

version: 2

campos_requeridos:
  # === Beneficiario ===
  - id: beneficiario_razon_social
    descripcion: "Nombre o razón social del beneficiario"
    tipo: string

  - id: beneficiario_id_tipo
    descripcion: "Tipo de identificación (C.C., NIT, C.E.)"
    tipo: string
    valores_permitidos: ["C.C.", "NIT", "C.E."]
    alias: ["tipo_documento", "tipo_id"]

  - id: beneficiario_id_numero
    descripcion: "Número de identificación"
    tipo: string
    patron: "^[0-9.\\-]{6,20}$"
    alias: ["numero_documento", "cedula", "nit"]

  - id: beneficiario_direccion
    descripcion: "Dirección del beneficiario"
    tipo: string

  - id: beneficiario_telefono
    descripcion: "Teléfono del beneficiario"
    tipo: string

  - id: beneficiario_municipio
    descripcion: "Municipio del beneficiario"
    tipo: string

  - id: beneficiario_departamento
    descripcion: "Departamento del beneficiario"
    tipo: string

  # Lo CALCULA el enricher con `clasificacion/tamano_productor.py` a partir de los
  # ingresos brutos anuales y los activos totales (Manual Finagro 7.1), así que va
  # marcado como derivado: la validación corre antes del enricher y si no se
  # excluye sale como brecha falsa. Si faltan los estados financieros se conserva
  # lo que el correo dijera.
  - id: tipo_beneficiario
    descripcion: "Segmento del productor según el numeral 7.1 del Manual Finagro"
    tipo: string
    derivado: true
    valores_permitidos:
      # Los cuatro segmentos del manual (el formulario solo tiene 3 casillas: los
      # dos de pequeño comparten la de F14).
      - "pequeño productor de ingresos bajos"
      - "pequeño productor"
      - "mediano productor"
      - "gran productor"
      # Formas cortas heredadas: las usan el demo y los correos redactados a mano.
      - "pequeño"
      - "pequeno"
      - "mediano"
      - "grande"

  # === Predio ===
  - id: predio_nombre_direccion
    descripcion: "Nombre y/o dirección del predio"
    tipo: string

  - id: predio_extension_has
    descripcion: "Extensión del predio en hectáreas"
    tipo: number
    rango: { min: 0.01, max: 100000 }

  - id: predio_departamento
    descripcion: "Departamento del predio"
    tipo: string

  - id: predio_municipio
    descripcion: "Municipio del predio"
    tipo: string

  - id: predio_vereda
    descripcion: "Vereda del predio"
    tipo: string

  - id: tenencia
    descripcion: "Tenencia del predio (propia/arriendo/otra)"
    tipo: string
    valores_permitidos: ["propia", "arriendo", "otra"]

  # === Sección 2 y 3 ===
  - id: forma_de_llegar
    descripcion: "Forma detallada de llegar al sitio de la inversión"
    tipo: string

  - id: justificacion_tecnica
    descripcion: "Justificación técnica y descripción de las inversiones"
    tipo: string

  # === Sección 5: tabla de actividades ===
  # El mapper extrae por actividad la descripción en lenguaje natural
  # (`actividad`/`destino`, insumo del code_resolver) y las cifras financieras.
  # Los CÓDIGOS (cod_linea, cod_rubro, descripcion_rubro) NO los extrae el
  # mapper: los infiere el sub-agente code_resolver a partir de `actividad`/
  # `destino`. No agregarlos aquí.
  - id: actividades
    descripcion: "Lista de actividades a financiar (mínimo 1)"
    tipo: array
    min_items: 1
    max_items: 4
    item_fields:
      - id: actividad
        descripcion: "Actividad económica/productiva en lenguaje natural (p. ej. 'cultivo de café', 'engorde de novillos')"
        tipo: string
      - id: destino
        descripcion: "Uso específico del crédito en lenguaje natural (p. ej. 'renovación de cafetales', 'compra de insumos')"
        tipo: string
      - id: unidades_hectareas
        descripcion: "Unidades o hectáreas de la actividad"
        tipo: number
      - id: valor_total_proyecto
        descripcion: "Valor total del proyecto para esta actividad (en miles de pesos, igual que el formulario)"
        tipo: number
      - id: valor_total_credito
        descripcion: "Valor total del crédito solicitado para esta actividad (en miles de pesos)"
        tipo: number
      - id: plazo_meses
        descripcion: "Plazo del crédito en meses"
        tipo: number
      - id: periodo_gracia_meses
        descripcion: "Período de gracia en meses"
        tipo: number
      - id: puntos_dtf
        descripcion: "Puntos adicionales sobre DTF (tasa)"
        tipo: number

  # === Sección 6 ===
  - id: actividad_economica_descripcion
    descripcion: "Actividad económica productiva del beneficiario"
    tipo: string

  # === Sección 7 ===
  - id: garantia_fag
    descripcion: "¿Solicita garantía FAG? (si/no)"
    tipo: string
    valores_permitidos: ["si", "sí", "no"]

campos_opcionales:
  # === Estados financieros: entradas de la clasificación del tamaño (7.1) ===
  # Vienen de los estados financieros adjuntos al correo. Sin AMBAS cifras la
  # calculadora no puede clasificar y `tipo_beneficiario` se queda con lo que
  # dijera el correo. Pasarlas a `campos_requeridos` haría que su ausencia salga
  # como brecha en el dashboard.
  - id: beneficiario_ingresos_brutos_anuales
    descripcion: "Ingresos brutos anuales del beneficiario, en pesos"
    tipo: number
    alias: ["ingresos_brutos", "ingresos_anuales", "ingresos_operacionales"]
  - id: monto_total_activos
    descripcion: "Activos totales del beneficiario, en pesos"
    tipo: number
    alias: ["activos_totales", "total_activos"]
  # Fecha de corte de los estados financieros (F16/H16/J16 del formulario). Es
  # también el hecho con el que `clasificacion/periodo.py` decide si las cifras
  # salen de un periodo CERRADO (Manual p.15, num. 7a).
  - id: fecha_balance_dia
    descripcion: "Día de la fecha de corte de los estados financieros"
    tipo: number
  - id: fecha_balance_mes
    descripcion: "Mes de la fecha de corte de los estados financieros"
    tipo: number
  - id: fecha_balance_anio
    descripcion: "Año de la fecha de corte de los estados financieros"
    tipo: number
  # `derivado: true` NO significa que lo calcule el enricher (lo extrae el
  # mapper): significa que no se valida por separado. Su ausencia ya se reporta
  # con la brecha de periodo, que dice qué pedir; una brecha "campo ausente"
  # encima sería ruido duplicado y críptico para el remitente.
  - id: estados_financieros_meses_cubiertos
    descripcion: "Meses que cubre el estado de resultados (12 = periodo cerrado)"
    tipo: number
    derivado: true
    alias: ["meses_cubiertos", "periodo_meses"]
  - id: tenencia_otra_cual
    tipo: string
  - id: modalidad_pago_capital
    tipo: string
  - id: modalidad_pago_intereses
    tipo: string
  # Derivados: los calcula el `enricher` tras la validación (no vienen del
  # correo). `derivado: true` los excluye de brechas y completitud.
  - id: cronograma_fecha_inicial
    tipo: string
    derivado: true
  - id: cronograma_fecha_final
    tipo: string
    derivado: true
  - id: actividad_economica_codigo
    tipo: string
    derivado: true
  - id: fag_cobertura_pct
    tipo: number
    rango: { min: 0, max: 100 }
  - id: elaborado_por_nombre
    tipo: string
  - id: elaborado_por_cargo
    tipo: string
  - id: elaborado_por_fecha
    tipo: string

# Reglas cruzadas (TODO: implementar en validator)
reglas_cruzadas:
  - id: actividades_no_vacia
    descripcion: "Debe haber al menos una actividad con valor > 0"
    severidad: error
  - id: total_credito_consistente
    descripcion: "Suma de valor_total_credito ≤ suma de valor_total_proyecto"
    severidad: warning

# Umbral de aprobación
umbral_aprobacion:
  campos_requeridos_minimo: 0.85   # 85% de los requeridos
  campos_opcionales_minimo: 0.0
